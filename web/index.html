<div id="world-wrap" aria-hidden="true"><canvas id="world"></canvas><div class="world-fade"></div></div>
<div class="fx-vignette" aria-hidden="true"></div>
<div class="fx-grain" aria-hidden="true"></div>

<div class="app">
  <header class="hud" id="hud">
    <div class="hud-left">
      <a class="btn btn-ghost back-btn" id="back-btn" href="#today" hidden><svg class="icon" aria-hidden="true"><use href="#i-chevron-left"/></svg><span>Back</span></a>
      <a class="hud-brand" href="#today" aria-label="Epoch hub"><span class="logo sq" aria-hidden="true"><svg viewBox="0 0 24 24"><path class="logo-curve" d="M4 5.5c1.6 6.4 4.2 10.5 8 10.5s6.4-4.1 8-10.5"/><circle class="logo-ball" cx="12" cy="16" r="2.7"/></svg></span><span class="wordmark">EPOCH</span></a>
    </div>
    <nav class="hud-tabs" id="hud-tabs" aria-label="Main"></nav>
    <div class="hud-right">
      <span class="hud-stat combo" title="Day combo"><svg class="icon" aria-hidden="true"><use href="#i-flame"/></svg><b class="num" id="streak-num">0</b><span class="visually-hidden">day combo</span></span>
      <span class="hud-stat shards only-wide" title="Experience"><svg class="icon" aria-hidden="true"><use href="#i-sparkles"/></svg><b class="num" id="shards-num" data-xp-text>0</b><span class="visually-hidden">XP</span></span>
      <button type="button" class="hud-btn" data-action="palette" aria-label="Search"><svg class="icon" aria-hidden="true"><use href="#i-search"/></svg></button>
      <button type="button" class="hud-btn" id="sound-btn" data-action="sound" data-sfx="none" aria-pressed="true" aria-label="Sound on"></button>
      <button type="button" class="hud-player" data-action="account" aria-label="Operator and settings"><span class="lvl" id="hud-level"></span><span class="who"><b>Operator</b><span id="hud-rank">Rank</span></span></button>
    </div>
  </header>

  <main class="main" id="main">
    <div class="inner"><div id="view" class="view" tabindex="-1"></div></div>
  </main>

  <div class="tabbar-lift lift">
    <nav class="tabbar glass-strong" id="tabbar" aria-label="Main"></nav>
  </div>
</div>

<div class="splash" id="splash" aria-hidden="true">
  <div class="splash-inner">
    <span class="logo sq"><svg viewBox="0 0 24 24"><path class="logo-curve" d="M4 5.5c1.6 6.4 4.2 10.5 8 10.5s6.4-4.1 8-10.5"/><circle class="logo-ball" cx="12" cy="16" r="2.7"/></svg></span>
    <div class="splash-title">EPOCH</div>
    <div class="splash-line"></div>
    <div class="hud-label splash-sub">Descend the loss landscape</div>
  </div>
</div>
